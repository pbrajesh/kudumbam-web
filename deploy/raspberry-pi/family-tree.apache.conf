# Apache on the Raspberry Pi: serves the app and passes /api to the API server on this Pi.
# Set up once (the guide, step 7):
#   sudo a2enmod proxy proxy_http headers
#   sudo cp /opt/family-tree/deploy/family-tree.apache.conf /etc/apache2/sites-available/family-tree.conf
#   sudo nano /etc/apache2/sites-available/family-tree.conf          # set ServerName below
#   sudo a2ensite family-tree && sudo apache2ctl configtest && sudo systemctl reload apache2
#
# ServerName is the address relatives use (e.g. family.example.com). Apache picks this site by that name, so any
# other sites on this Apache keep working. With port forwarding instead of Cloudflare Tunnel, add HTTPS with
#   sudo apt install -y certbot python3-certbot-apache && sudo certbot --apache -d family.example.com

# Access log without query strings (they can contain an email address when deleting an account) and without the
# Authorization header. Behind Cloudflare Tunnel the visitor's address is the first one in X-Forwarded-For.
LogFormat "%{X-Forwarded-For}i %h %t \"%m %U %H\" %>s %b \"%{User-Agent}i\"" familytree

<VirtualHost *:80>
	ServerName family.example.com
	ServerAlias familytree.local

	DocumentRoot /opt/family-tree/app
	<Directory /opt/family-tree/app>
		Require all granted
		Options -Indexes
		AllowOverride None
		# Real files when they exist, otherwise index.html so links like /t/<id> and /privacy open directly.
		FallbackResource /index.html
	</Directory>

	# The API (Node, systemd service family-tree-api) only listens on this Pi.
	ProxyPreserveHost On
	ProxyPass        /api/ http://127.0.0.1:3000/api/
	ProxyPassReverse /api/ http://127.0.0.1:3000/api/

	# File names with a content hash (main-AB12CD34.js) never change: cache them for a year. Pages: always check.
	<LocationMatch "-[A-Z0-9]{8}\.(js|css)$">
		Header set Cache-Control "public, max-age=31536000, immutable"
	</LocationMatch>
	<If "%{REQUEST_URI} !~ m#^/api/# && %{REQUEST_URI} !~ m#\.(js|css|woff2?|png|svg|ico|txt)$#">
		Header set Cache-Control "no-cache"
	</If>

	# Only this site's own code may run; it may talk to this site and to your Supabase project (sign-in).
	# If you move to another Supabase project, change the address below.
	Header set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://vyzygojjbhxqcpknasmm.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
	Header set X-Content-Type-Options nosniff
	Header set Referrer-Policy no-referrer
	Header set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
	ServerSignature Off

	ErrorLog ${APACHE_LOG_DIR}/family-tree-error.log
	CustomLog ${APACHE_LOG_DIR}/family-tree.log familytree
</VirtualHost>
